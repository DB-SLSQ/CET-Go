<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ntest</title>
<style>html,body{margin:0;background:#111;color:#0f0;font:13px/1.6 Consolas,monospace}
iframe{position:absolute;left:-4000px;top:0;width:1280px;height:860px;border:0}
pre{padding:12px}</style></head>
<body>
<iframe id="f"></iframe>
<pre id="out">running…</pre>
<script>
/* ============================================================
   原生外壳专项自测：把 app.js 的「手机 App 分支」真跑一遍
   ------------------------------------------------------------
   打包成 APK 之后没有 /api/state 这个后端，存档改走外壳注入的
   window.CetGoNative。这条路径在桌面浏览器里永远不会被走到，
   所以必须专门造一个假的桥来测 —— 否则「装了 App 却存不上档」
   这种错要等用户玩完一局才发现。

   做法：把 index.html 取回来，在 </body> 前插一段
   <script src="/_nmock.js">（它定义假的 CetGoNative），
   再用 document.write 喂进 iframe —— 这样假桥一定在 app.js
   之前执行，而前端代码一行都不用改。

   覆盖四件事：
     1. 识别到原生模式（App.isNative）
     2. 启动时读存档走桥、且**没有**任何 /api/* 请求
     3. 打完一局后写存档走桥，内容合法
     4. 「重开一次」能读回上一次的成绩（真正的持久化）
     5. 设置页「立即备份」走桥
   ============================================================ */
var out = document.getElementById('out');
out.textContent = '脚本已开始执行…';
var f = document.getElementById('f');
var lines = [], pass = 0, fail = 0;
function ok(name, cond, extra) {
  if (cond) { pass++; lines.push('✓ ' + name); }
  else { fail++; lines.push('✗ ' + name + (extra !== undefined ? '  → ' + extra : '')); }
  out.textContent = lines.join('\n');      // 边跑边吐，卡住时也能看到走到哪一步
}
function step(s) {
  lines.push('· ' + s);
  out.textContent = lines.join('\n');
}
function done(tag) {
  out.textContent = lines.join('\n') + '\n\n===== ' + tag + ' pass ' + pass + ' / fail ' + fail + ' =====';
  document.title = tag + ' pass=' + pass + ' fail=' + fail;
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var HTML = null;

async function boot() {
  step('boot: 取 index.html');
  if (HTML === null) HTML = await fetch('/index.html').then(function (r) { return r.text(); });
  step('boot: index.html ' + HTML.length + ' 字节');
  var w = f.contentWindow;
  // 假桥必须排在 app.js 前面。
  // 注意：这段字符串里的结束标签一定要写成带反斜杠的形式（见下一个参数），
  // 否则 HTML 解析器会把本页这个脚本块提前闭合，整段测试代码根本不执行。
  // 连注释里都不能出现那个字面量（踩过两次），要提到就写「结束标签」。
  var html = HTML.replace(
    '<script src="/js/app.js"><\/script>',
    '<script src="/_nmock.js"><\/script>\n<script src="/js/app.js"><\/script>'
  );
  if (html === HTML) throw new Error('没能在 index.html 里找到 app.js 的 script 标签');
  step('boot: 注入 document.write');
  w.document.open();
  w.document.write(html);
  w.document.close();
  // 无头浏览器里 CSS 过渡不随虚拟时钟推进，量之前先关掉
  await sleep(30);
  var st = w.document.createElement('style');
  st.textContent = '*,*::before,*::after{transition:none!important;animation:none!important}';
  w.document.head.appendChild(st);
  step('boot: 完成');
  return w;
}

async function waitApp(w) {
  for (var i = 0; i < 200; i++) {
    if (w.App && w.App.Words && w.App.Words.loaded &&
        w.document.querySelector('#s-title.show')) return true;
    await sleep(60);
  }
  return false;
}

async function run() {
  var w = f.contentWindow;
  // 干净起点（about:blank 的 iframe 是不透明来源，碰 localStorage 会抛，先吞掉）
  try { w.localStorage.removeItem('cetgo-mock-state'); } catch (e) {}

  /* ---------- 第一次启动 ---------- */
  w = await boot();
  ok('假桥在 app.js 之前就位', !!w.CetGoNative && typeof w.__mockLog === 'object',
     typeof w.CetGoNative);
  step('等待 App 启动…');
  if (!await waitApp(w)) { ok('第一次启动进入标题屏', false, '超时'); return; }
  step('App 已进入标题屏');

  var log = w.__mockLog;
  w.__mockReset();
  ok('前端识别到原生模式（走桥，不发 HTTP）', w.App.isNative === true, String(w.App.isNative));

  var s0 = w.App.getState();
  ok('首次启动是空档（经典模式 plays=0）',
     s0.records && s0.records.classic && s0.records.classic.plays === 0,
     JSON.stringify(s0.records && s0.records.classic));

  /* ---------- 读存档确实走了桥 ---------- */
  // 复位后再手动触发一次读盘，确认函数体走的是 NATIVE 分支
  var raw = w.CetGoNative.loadState();
  ok('桥的 loadState 可用', raw === null || typeof raw === 'string', String(raw));
  ok('全程没有 /api/state 请求', log.api.filter(function (x) { return x.indexOf('/api/state') >= 0; }).length === 0,
     JSON.stringify(log.api));
  ok('全程没有 /api/ping 心跳', log.api.filter(function (x) { return x.indexOf('/api/ping') >= 0; }).length === 0,
     JSON.stringify(log.api.slice(0, 4)));

  /* ---------- 打一局，看写盘 ---------- */
  w.App.startFlow('classic');
  w.App.confirmReady();
  await sleep(120);
  ok('开局成功（游戏态已建立）', !!w.App.getGame(), String(!!w.App.getGame()));
  w.App._gameOver();
  await sleep(200);          // 存档是 450ms 防抖 + 落盘，这里留够

  var wrote = log.writes.length > 0;
  ok('结束一局后调用了桥的 saveState', wrote, 'writes=' + log.writes.length);
  var saved = null;
  try { saved = wrote ? JSON.parse(log.writes[log.writes.length - 1]) : null; } catch (e) {}
  ok('写进桥的数据是合法 JSON', !!saved, wrote ? log.writes[0].slice(0, 60) : '没写');
  var rec = saved && saved.records && saved.records.classic;
  ok('存档里有 records.classic.plays / wrongbook / settings',
     !!rec && rec.plays >= 1 && typeof saved.wrongbook === 'object' && !!saved.settings,
     saved ? ('classic.plays=' + (rec && rec.plays) + ' keys=' + Object.keys(saved).join(',')) : '—');

  /* ---------- 切后台立即落盘 ---------- */
  var before = log.writes.length;
  w.App.flushSave();
  await sleep(50);
  ok('flushSave（切后台时外壳调用的那个）能立刻落盘', log.writes.length > before,
     before + ' -> ' + log.writes.length);

  /* ---------- 重开一次：数据要还在 ---------- */
  var expectPlays = rec ? rec.plays : 0;
  // 防「两边都是 undefined」的假绿：先确认确实存进去了一局
  ok('上一局确实记了账（拿得到非零局数，重开对比才有意义）', expectPlays >= 1,
     'classic.plays=' + expectPlays);
  w = await boot();
  if (!await waitApp(w)) { ok('重开后进入标题屏', false, '超时'); return; }
  var s1 = w.App.getState();
  ok('重开后读回了上一局（走桥读盘）', s1.records.classic.plays === expectPlays,
     'plays=' + s1.records.classic.plays + '，期望 ' + expectPlays);
  ok('重开后仍然是原生模式', w.App.isNative === true);

  /* ---------- 设置页的「立即备份」 ---------- */
  w.__mockReset();
  w.App._renderSettings();
  var btns = Array.prototype.slice.call(w.document.querySelectorAll('#s-set button'));
  var bk = btns.filter(function (b) { return b.textContent.indexOf('立即备份') >= 0; })[0];
  ok('设置页有「立即备份」按钮', !!bk, btns.map(function (b) { return b.textContent; }).join(' | ').slice(0, 120));
  if (bk) {
    bk.click();
    await sleep(80);
    ok('备份走的是桥的 backup()（不是 /api/backup）', typeof w.__mockLog.backup === 'string',
       String(w.__mockLog.backup).slice(0, 40));
  }
}

(async function () {
  try {
    await run();
    done('OK');
  } catch (e) {
    lines.push('💥 ' + e.message);
    lines.push((e.stack || '').split('\n')[1] || '');
    done('ERR');
  }
})();
</script>
</body></html>
